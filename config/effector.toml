# Effector (夹爪) 配置

# 仿真模式
# simulate: true = 使用仿真夹爪（FakeEffector），false = 使用真实 CAN 夹爪（RealEffector）
simulate = false

# DJI M2006 电机 ID
id = 8

# 方向系数 (1.0 或 -1.0)
dir = 1.0

# MIT 模式参数
mit_pid = { kp = 5.0, kd = 0.5 }

# MIT 模式前馈力矩 (N·m)
mit_feedforward_torque = 0.4

# 夹持力矩 (N·m) - 保持抓取时的力矩
holding_torque = 1.1

# 回零参数
zeroing_torque = 1.2              # 回零时的恒定力矩 (N·m)
zeroing_velocity_threshold = 0.01 # 静止检测速度阈值 (rad/s)
zeroing_stall_time_ms = 150       # 静止持续时间阈值 (ms)

# 限位参数
open_position = 1.0 # 张开位置 (rad)

# 碰撞检测参数
collision_current_threshold = 5000.0 # 电流阈值 (mA)

# 仿真参数
sim_pos_max = 2.0    # 仿真模式下的最大位置 (rad)
sim_move_speed = 3.0 # 仿真模式下的移动速度 (rad/s)
