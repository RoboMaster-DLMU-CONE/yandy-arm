simulate = true

# 仿真模式下手持相机在 base_link 坐标系中的固定位姿
# translation: [x, y, z] 单位 m；rpy: [roll, pitch, yaw] 单位 rad，ZYX 顺序
[simulate_camera]
translation = [0.4, -0.4, 0.6]
rpy = [-1.7, 0.0, 0.0]

[simulate_rerun]
ip = "127.0.0.1"
port = 9876

# 仿真模式下虚拟能量单元配置
# mode: "fixed" 使用固定坐标, "random" 每次取矿后随机生成
[simulate_vision]
mode = "fixed"
# 固定模式下的能量单元位姿 (base_link 坐标系)
# position: [x, y, z] 单位 m; rpy: [roll, pitch, yaw] 单位 rad
# pitch=π/2 表示水平逼近 (从靠近机械臂一侧)
position = [0.45, 0.0, 0.62]
rpy = [0.0, 1.5708, 0.0]
# 随机模式下的生成范围 (base_link 坐标系)
random_x_range = [0.2, 0.4]
random_y_range = [-0.2, 0.2]
random_z_range = [0.1, 0.3]
random_roll_range = [-0.3, 0.3]
# pitch=π/2 为水平逼近 (从靠近机械臂一侧)
random_pitch_range = [1.3, 1.9]
