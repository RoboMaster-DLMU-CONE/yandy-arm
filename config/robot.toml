# Robot 主配置

# simulate: true = 全仿真模式（仿真机械臂 + 仿真夹爪 + 仿真视觉）
#          false = 真实硬件模式（可通过各子模块的 simulate 选项单独控制）
simulate = true

# force_simulate_vision: 强制使用仿真视觉（即使真实相机存在）
#                        适用于：真实机械臂 + 仿真视觉的混合调试模式
force_simulate_vision = false

# 仿真模式下手持相机在 base_link 坐标系中的固定位姿
# translation: [x, y, z] 单位 m；rpy: [roll, pitch, yaw] 单位 rad，ZYX 顺序
[simulate_camera]
translation = [0.4, -0.4, 0.6]
rpy = [-1.7, 0.0, 0.0]

[simulate_rerun]
ip = "127.0.0.1"
port = 9876

# 仿真模式下虚拟能量单元配置
# mode: "fixed" 使用固定坐标, "random" 每次取矿后随机生成
[simulate_vision]
mode = "fixed"
# 固定模式下的能量单元位姿 (base_link 坐标系)
# position: [x, y, z] 单位 m; rpy: [roll, pitch, yaw] 单位 rad
position = [0.55, 0.03, 0.50]
rpy = [1.2, 3.14, 0.0]
# 随机模式下的生成范围 (base_link 坐标系)
random_x_range = [0.2, 0.4]
random_y_range = [-0.2, 0.2]
random_z_range = [0.1, 0.3]
random_roll_range = [-0.3, 0.3]
# pitch=π/2 时圆柱竖直、从 X 方向逼近瓶身
random_pitch_range = [1.3, 1.9]

[fetch]
stability_window = 10       # 稳定性检测窗口 (帧数)
stability_threshold = 0.005 # 位置方差阈值 (m)
pregrasp_distance = 0.2     # 预抓取距离 (m)
approach_speed = 0.1        # 逼近速度 (m/s)
extract_distance = 0.1      # 提取距离：抓取后沿提取方向移动的距离 (m)
# 提取方向由视觉解析的能量单元位姿自动计算 (末端 X 轴 = 瓶口反方向)，无需手动配置

[store]
approach_offset = 0.15 # 存取矿时，沿世界 Z 轴（竖直向上）的预接近距离 (m)
# 停顿：到达 above_pose 后的等待时间（秒）
pause_after_above_s = 0.8
# 在开爪前等待/开爪后等待/闭爪后等待（秒）
wait_before_open_s = 0.8
wait_after_open_s = 0.8
wait_after_close_s = 0.8
# PreFetch 位置停留时间（在下降到 store_frame 之前，秒）
pause_pre_fetch_s = 0.1
# 存矿退回位姿（retreat）：相对 store_frame 的偏移 (xyz + rpy)
# 对于 store_frame_2 (y<0)，y 和 yaw 会自动镜像
retreat_x_m = 0.0606
retreat_y_m = 0.0411
retreat_z_m = -0.0658
retreat_roll_m = 0.9869
retreat_pitch_m = 0.8023
retreat_yaw_m = 0.8133
# 取矿预抓取位姿（prefetch）：相对 store_frame 的偏移 (xyz + rpy)
# 对于 store_frame_2 (y<0)，y 和 yaw 会自动镜像
prefetch_x_m = 0.0606
prefetch_y_m = 0.0411
prefetch_z_m = -0.0658
prefetch_roll_m = 0.9869
prefetch_pitch_m = 0.8023
prefetch_yaw_m = 0.8133
